
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Edit your Nairabox event details.">

    <title>Edit Event | Nairabox</title>

    <link rel="stylesheet" href="./edit-event.css">
</head>

<body>

    <nav class="create-nav">
        <a href="./dashboard.html" class="brand">nairabox</a>

        <a href="./dashboard.html" class="back-btn">
            Back To Dashboard
        </a>
    </nav>

    <main class="create-event">
        <div class="event-container">

            <div class="top">
                <span class="eyebrow">EVENT MANAGEMENT</span>
                <h1>Edit Your Event</h1>
                <p>Update your event information below.</p>
            </div>

            <p id="pageMessage" class="page-message" role="status">
                Loading event details...
            </p>

            <form id="eventForm" hidden>

                <div class="input-group">
                    <label for="eventTitle">Event Title</label>
                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="Enter event title"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="eventCategory">Category</label>
                    <input
                        type="text"
                        id="eventCategory"
                        placeholder="Music, Comedy, Tech..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="eventDescription">Description</label>
                    <textarea
                        id="eventDescription"
                        placeholder="Describe your event..."
                        required
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="eventLocation">Location</label>
                    <input
                        type="text"
                        id="eventLocation"
                        placeholder="Event location"
                        required
                    >
                </div>

                <div class="double-input">

                    <div class="input-group">
                        <label for="eventDate">Event Date</label>
                        <input
                            type="date"
                            id="eventDate"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="eventTime">Event Time</label>
                        <input
                            type="time"
                            id="eventTime"
                            required
                        >
                    </div>

                </div>

                <div class="input-group">
                    <label for="ticketPrice">Ticket Price (₦)</label>
                    <input
                        type="number"
                        id="ticketPrice"
                        min="0"
                        step="0.01"
                        placeholder="Enter ticket price"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="eventImage">Event Flyer Image URL</label>
                    <input
                        type="url"
                        id="eventImage"
                        placeholder="Paste event image URL"
                    >
                    <small>Leave this unchanged if you want to keep your current flyer.</small>
                </div>

                <div class="form-actions">
                    <a href="./dashboard.html" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" id="saveBtn">
                        Save Changes
                    </button>
                </div>

            </form>

        </div>
    </main>

    <script type="module" src="./edit-event.js"></script>

</body>
</html>
