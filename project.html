<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nairabox HomePage</title>

    <link rel="stylesheet" href="./project.css">

</head>

<body>




<!-- NAVBAR -->
<nav>

    <h2>nairabox</h2>

    <ul>

        <div class="nav1">

            <li>
                <a href="./project.html">
                    Home
                </a>
            </li>

            <li>
                <a href="./about.html">
                    About us
                </a>
            </li>

        </div>




        <div class="nav2">

            <li>
                <a href="./login.html">
                    Log In
                </a>
            </li>

            <button>

                <a href="./login.html">
                    Create Events
                </a>

            </button>

        </div>

    </ul>

</nav>





<!-- HERO SECTION -->
<section class="hero-section">

    <img 
        src="./project-pictures/hero (1).png" 
        alt=""
        class="hero-image"
    >

</section>





<!-- SEARCH SECTION -->
<section class="search-section">

    <input 
        type="text"
        id="searchInput"
        placeholder="Search By Event Name"
    >

</section>





<!-- EVENTS SECTION -->
<section class="events-section">

    <div class="events-header">

        <h1>
            Upcoming Events
        </h1>

    </div>




    <!-- DYNAMIC EVENTS -->
    <div id="eventsContainer">

        <!-- EVENTS FROM FIRESTORE -->

    </div>

</section>






<!-- FOOTER -->
<footer class="footer">

    <div class="top">




        <div class="left">

            <div class="img-logo">

                <img 
                    src="./project-pictures/hero (2).png" 
                    alt="" 
                    style="width: 50px;height: 50px;"
                >

                <h2>nairabox</h2>

            </div>

            <p>
                Grab your exclusive tickets right here
            </p>

        </div>





        <div class="middle">

            <h4>
                Support
            </h4>

        </div>





        <div class="right">

            <h3>
                Sign up for our newsletter
            </h3>

            <p>
                Be the first to know about upcoming events,
                exclusive deals and insider updates
            </p>




            <div class="email-btn">

                <input 
                    type="email"
                    placeholder="Enter your email"
                >

                <button>
                    Subscribe
                </button>

            </div>

        </div>

    </div>





    <div class="bottom">

        <p>
            © 2025 Nairabox. All rights reserved.
        </p>

        <a href="#">
            Privacy Policy
        </a>

    </div>

</footer>





<!-- JAVASCRIPT -->
<script type="module" src="./project.js"></script>
